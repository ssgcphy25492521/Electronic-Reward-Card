<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSGC Physics Challenges</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #1a202c;
            --primary: #3182ce;
            --success: #38a169;
            --stamp-locked: #cbd5e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 24px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-color);
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            min-height: 140px;
        }

        .card.zone-complete {
            border: 2px solid var(--success);
            background: #f0fff4;
        }

        .label {
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 12px;
        }

        .card.zone-complete .label {
            color: var(--success);
        }

        /* Stamps Layout Inside Each Zone Card */
        .stamps-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .stamp-slot {
            width: 50px;
            height: 50px;
            border: 2px dashed var(--stamp-locked);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            position: relative;
            transition: all 0.3s ease;
        }

        .stamp-slot .icon {
            font-size: 24px;
            filter: grayscale(100%);
            opacity: 0.15;
            transition: all 0.3s ease;
        }

        /* Active Slot Styling */
        .stamp-slot.active {
            border: 2px solid var(--success);
            background: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 4px 6px rgba(56, 161, 105, 0.1);
        }

        .stamp-slot.active .icon {
            filter: grayscale(0%);
            opacity: 1;
        }

        /* Small Checkmark Indicator */
        .stamp-mark {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--success);
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .stamp-slot.active .stamp-mark {
            opacity: 1;
            transform: scale(1);
        }

        .congrats {
            display: none;
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
            border: 1px solid #9ae6b4;
            animation: pop 0.4s ease-out;
        }

        .reset-btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid #e2e8f0;
            color: #a0aec0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #edf2f7;
            color: #4a5568;
            border-color: #cbd5e0;
        }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

                    <div class="stamp-slot slot-2"><div class="stamp-mark">✓</div><div class="icon">🚀</div></div>
                </div>
            </div>
        </div>

        <div class="congrats" id="congratsMessage">
            🎉 Congratulations! You have completed all 12 Physics Challenges!
        </div>

        <button class="reset-btn" onclick="resetCard()">Reset Card Data (Testing)</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const boothScanned = urlParams.get('booth');

        // Expanded list of valid booth IDs to 6 items
        const validBooths = ['booth1', 'booth2', 'booth3', 'booth4', 'booth5', 'booth6'];

        if (boothScanned && validBooths.includes(boothScanned)) {
            // Get current count for this scanned booth (defaults to 0 if not stored)
            let currentStamps = parseInt(localStorage.getItem(boothScanned)) || 0;
            
            // Limit to max 2 stamps per booth
            if (currentStamps < 2) {
                currentStamps++;
                localStorage.setItem(boothScanned, currentStamps.toString());
            }
            
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({path: cleanUrl}, '', cleanUrl);
        }

                if (stampCount >= 1) {
                    slot1.classList.add('active');
                } else {
                    slot1.classList.remove('active');
                }
