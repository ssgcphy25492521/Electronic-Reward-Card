<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSGC 120th Anniversary Open Day</title>
    <style>
        :root {
            --bg-color: #0a192f; 
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --primary: #1a365d; 
            --success: #2f855a; 
            --border-color: #cbd5e0;
            --stamp-locked: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            text-align: center;
            box-sizing: border-box;
            margin-top: 20px;
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .school-badge {
            width: 100px;
            height: auto;
            margin-bottom: 15px;
        }

        .school-title {
            color: var(--primary);
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
            line-height: 1.3;
            white-space: pre-line;
        }

        .event-title {
            color: #4a5568;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
            white-space: pre-line;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .card {
            background: #f7fafc;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            min-height: 125px;
        }

        .card.zone-complete {
            border: 2px solid var(--success);
            background: #f0fff4;
            box-shadow: 0 4px 6px -1px rgba(72, 187, 120, 0.1);
        }

        .label {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .card.zone-complete .label {
            color: var(--success);
        }

        /* 雙印章版面樣式 */
        .stamps-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        .stamp-slot {
            width: 48px;
            height: 48px;
            border: 2px dashed var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            position: relative;
            transition: all 0.3s ease;
        }

        .stamp-slot .icon {
            font-size: 24px;
            filter: grayscale(100%);
            opacity: 0.2;
            transition: all 0.3s ease;
            margin: 0;
        }

        /* 已獲取印章的樣式 */
        .stamp-slot.active {
            border: 2px solid var(--success);
            background: #ffffff;
            transform: scale(1.05);
        }

        .stamp-slot.active .icon {
            filter: grayscale(0%);
            opacity: 1;
        }

        /* 小勾勾打印標記 */
        .stamp-mark {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--success);
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            transition: all 0.25s ease;
        }

        .stamp-slot.active .stamp-mark {
            opacity: 1;
            transform: scale(1);
        }

        .congrats {
            display: none;
            background: #e6fffa;
            color: #234e52;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #b2f5ea;
            animation: pop 0.4s ease-out;
        }

        .reset-btn {
            margin-top: 25px;
            background: transparent;
            border: 1px solid #cbd5e0;
            color: #a0aec0;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #edf2f7;
            color: #4a5568;
            border-color: #a0aec0;
        }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img class="school-badge" src="logo.png" alt="SSGC Crest">
            <h1 class="school-title">St. Stephen’s Girls’ College<br>聖士提反女子中學</h1>
            <h2 class="event-title">120<sup>th</sup> Anniversary Open Day<br>一百二十周年校慶開放日</h2>
        </header>

        <div class="grid">
            <!-- Zone 1 -->
            <div class="card" id="zone1">
                <div class="label">Zone 1</div>
                <div class="stamps-row">
                    <div class="stamp-slot slot-1"><div class="stamp-mark">✓</div><div class="icon">🏮</div></div>
                    <div class="stamp-slot slot-2"><div class="stamp-mark">✓</div><div class="icon">🏮</div></div>
                </div>
            </div>

            <!-- Zone 2 -->
            <div class="card" id="zone2">
                <div class="label">Zone 2</div>
                <div class="stamps-row">
                    <div class="stamp-slot slot-1"><div class="stamp-mark">✓</div><div class="icon">🎶</div></div>
                    <div class="stamp-slot slot-2"><div class="stamp-mark">✓</div><div class="icon">🎶</div></div>
                </div>
            </div>

            <!-- Zone 3 -->
            <div class="card" id="zone3">
                <div class="label">Zone 3</div>
                <div class="stamps-row">
                    <div class="stamp-slot slot-1"><div class="stamp-mark">✓</div><div class="icon">💻</div></div>
                    <div class="stamp-slot slot-2"><div class="stamp-mark">✓</div><div class="icon">💻</div></div>
                </div>
            </div>

            <!-- Zone 4 -->
            <div class="card" id="zone4">
                <div class="label">Zone 4</div>
                <div class="stamps-row">
                    <div class="stamp-slot slot-1"><div class="stamp-mark">✓</div><div class="icon">💼</div></div>
                    <div class="stamp-slot slot-2"><div class="stamp-mark">✓</div><div class="icon">💼</div></div>
                </div>
            </div>

            <!-- Zone 5 -->
            <div class="card" id="zone5">
                <div class="label">Zone 5</div>
                <div class="stamps-row">
                    <div class="stamp-slot slot-1"><div class="stamp-mark">✓</div><div class="icon">🧘‍♀️</div></div>
                    <div class="stamp-slot slot-2"><div class="stamp-mark">✓</div><div class="icon">🧘‍♀️</div></div>
                </div>
            </div>

            <!-- Zone 6 -->
            <div class="card" id="zone6">
                <div class="label">Zone 6</div>
                <div class="stamps-row">
                    <div class="stamp-slot slot-1"><div class="stamp-mark">✓</div><div class="icon">🏀</div></div>
                    <div class="stamp-slot slot-2"><div class="stamp-mark">✓</div><div class="icon">🏀</div></div>
                </div>
            </div>
        </div>

        <div class="congrats" id="congratsMessage">
            🎉 恭喜！您已成功集齊 12 個開放日活動印章！<br>
            Congratulations! You have collected all 12 Open Day stamps!
        </div>

        <button class="reset-btn" onclick="resetCard()">Reset 重置</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const zoneScanned = urlParams.get('zone'); 

        const validZones = ['zone1', 'zone2', 'zone3', 'zone4', 'zone5', 'zone6'];

        if (zoneScanned && validZones.includes(zoneScanned)) {
            // 讀取當前區域已有的印章數量，預設為 0
            let currentStamps = parseInt(localStorage.getItem(zoneScanned)) || 0;
            
            // 限制每個區域最多只能獲得 2 個印章
            if (currentStamps < 2) {
                currentStamps++;
                localStorage.setItem(zoneScanned, currentStamps.toString());
            }
            
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({path: cleanUrl}, '', cleanUrl);
        }

        function renderStamps() {
            let totalStampsEarned = 0;

            validZones.forEach(zone => {
                const stampCount = parseInt(localStorage.getItem(zone)) || 0;
                const cardElement = document.getElementById(zone);
