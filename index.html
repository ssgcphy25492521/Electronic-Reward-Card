<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSGC 120th Anniversary Open Day</title>
    <style>
        :root {
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --primary-blue: #1a365d; 
            --ssgc-blue: #1d4ed8;    
            --ssgc-gold: #facc15;    
            --ssgc-red: #ef4444;     
            --border-color: #cbd5e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* 升級為更加繽紛絢麗的校慶嘉年華漸變色（藍、紫、桃紅交織） */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 35%, #311042 70%, #4c0519 100%);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 五彩紙屑背景圖層 */
        .confetti-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sparkle {
            position: absolute;
            font-size: 16px;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 20px; 
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6), 0 10px 15px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
            box-sizing: border-box;
            margin-top: 15px;
            position: relative;
            z-index: 1; 
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .school-badge {
            width: 95px;
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .school-title {
            color: var(--primary-blue);
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
            line-height: 1.3;
            white-space: pre-line;
        }

        .event-title {
            color: #4a5568;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
            white-space: pre-line;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 25px;
            margin-top: 15px;
            justify-items: center;
        }

        /* 圓形徽章基礎樣式 */
        .card {
            background: #f8fafc;
            border: 3px solid var(--border-color);
            border-radius: 50%;
            width: 135px;
            height: 135px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-sizing: border-box;
            box-shadow: inset 0 0 0 4px rgba(0,0,0,0.03), 0 4px 10px rgba(0,0,0,0.15);
        }

        /* 激活後的彩色亮麗效果（金色光暈） */
        .card.active {
            background: var(--ssgc-blue);
            border: 4px solid var(--ssgc-gold);
            box-shadow: inset 0 0 0 5px rgba(250, 204, 21, 0.2), 
                        0 0 20px rgba(250, 204, 21, 0.6), 
                        0 10px 22px -5px rgba(29, 78, 216, 0.7);
            transform: translateY(-6px) scale(1.04);
        }

        .icon {
            font-size: 40px; 
            margin-bottom: 2px;
            filter: grayscale(100%);
            opacity: 0.15;
            transition: all 0.4s ease;
        }

        .card.active .icon {
            filter: grayscale(0%) drop-shadow(0 3px 6px rgba(0,0,0,0.3));
            opacity: 1;
            transform: scale(1.15);
        }

        .label {
            font-size: 13px;
            font-weight: 800;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .card.active .label {
            color: var(--ssgc-gold);
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        /* 紅底金勾圓章 */
        .stamp-mark {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--ssgc-red);
            color: var(--ssgc-gold);
            border: 2px solid var(--ssgc-gold);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0) rotate(-45deg);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .card.active .stamp-mark {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* 慶典繽紛祝賀橫幅 */
        .congrats {
            display: none;
            background: linear-gradient(135deg, #e6fffa 0%, #ccfbf1 100%);
            color: #0f4c46;
            padding: 16px;
            border-radius: 12px;
            margin-top: 15px;
            font-weight: 700;
            font-size: 15px;
            border: 2px solid #99f6e4;
            box-shadow: 0 4px 12px rgba(45, 212, 191, 0.2);
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .reset-btn {
            margin-top: 25px;
            background: transparent;
            border: 1px solid #cbd5e0;
            color: #a0aec0;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #edf2f7;
            color: #4a5568;
            border-color: #a0aec0;
        }

        @keyframes pop {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 浮動五彩紙屑圖層 -->
    <div class="confetti-bg" id="confettiContainer"></div>

    <div class="container">
        <header>
            <img class="school-badge" src="logo.png" alt="SSGC Crest">
            <h1 class="school-title">St. Stephen’s Girls’ College<br>聖士提反女子中學</h1>
            <h2 class="event-title">120<sup>th</sup> Anniversary Open Day<br>一百二十周年校慶開放日</h2>
        </header>

        <div class="grid">
            <!-- Zone 1 -->
            <div class="card" id="zone1">
                <div class="stamp-mark">✓</div>
                <div class="icon">🏮</div>
                <div class="label">Zone 1</div>
            </div>

            <!-- Zone 2 -->
            <div class="card" id="zone2">
                <div class="stamp-mark">✓</div>
                <div class="icon">🎶</div>
                <div class="label">Zone 2</div>
            </div>

            <!-- Zone 3 -->
            <div class="card" id="zone3">
                <div class="stamp-mark">✓</div>
                <div class="icon">💻</div>
                <div class="label">Zone 3</div>
            </div>

            <!-- Zone 4 -->
            <div class="card" id="zone4">
                <div class="stamp-mark">✓</div>
                <div class="icon">💼</div>
                <div class="label">Zone 4</div>
            </div>

            <!-- Zone 5 -->
            <div class="card" id="zone5">
                <div class="stamp-mark">✓</div>
                <div class="icon">🧘‍♀️</div>
                <div class="label">Zone 5</div>
            </div>

            <!-- Zone 6 -->
            <div class="card" id="zone6">
                <div class="stamp-mark">✓</div>
                <div class="icon">🏀</div>
                <div class="label">Zone 6</div>
            </div>
        </div>

        <div class="congrats" id="congratsMessage">
            🎉 恭喜！您已成功集齊 6 個開放日活動印章！<br>
            Congratulations! You have collected all 6 Open Day stamps!
        </div>

        <button class="reset-btn" onclick="resetCard()">Reset 重置</button>
    </div>

    <script>
        // 生成繽紛多色的漂浮五彩星光
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#facc15', '#4ade80', '#f43f5e', '#38bdf8', '#e879f9']; // 金黃、翠綠、桃紅、天藍、亮紫
            const count = 30; 

            for (let i = 0; i < count; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerText = '✨';
                sparkle.style.color = colors[Math.floor(Math.random() * colors.length)];
                sparkle.style.left = Math.random() * 100 + 'vw';
                sparkle.style.top = Math.random() * -20 + 'px';
                sparkle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                sparkle.style.animationDelay = (Math.random() * 5) + 's';
                sparkle.style.fontSize = (Math.random() * 10 + 12) + 'px';
                container.appendChild(sparkle);
            }
        }
