<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSGC 120th Anniversary Open Day</title>
    <style>
        :root {
            --bg-color: #0a192f; /* 深藍色背景 */
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --primary-blue: #1a365d; /* 學校標誌性的深藍色 */
            --ssgc-blue: #1d4ed8;    /* 校徽皇家藍 */
            --ssgc-gold: #facc15;    /* 校徽金黃色 */
            --ssgc-red: #ef4444;     /* 校徽五角星紅色 */
            --border-color: #cbd5e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            text-align: center;
            box-sizing: border-box;
            margin-top: 20px;
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
        }

        .school-title {
            color: var(--primary-blue);
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
            line-height: 1.3;
            white-space: pre-line;
        }

        .event-title {
            color: #4a5568;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
            white-space: pre-line;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 25px;
            margin-top: 15px;
            justify-items: center;
        }

        /* 改造成精緻的圓形徽章樣式 */
        .card {
            background: #f8fafc;
            border: 3px solid var(--border-color);
            border-radius: 50%;
            width: 135px;
            height: 135px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-sizing: border-box;
            /* 模擬校徽徽章的雙層金色虛線內環外觀 */
            box-shadow: inset 0 0 0 4px rgba(0,0,0,0.03), 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 當掃描激活後，徽章轉變為校徽配色（皇家藍底 + 金黃字） */
        .card.active {
            background: var(--ssgc-blue);
            border: 4px solid var(--ssgc-gold);
            box-shadow: inset 0 0 0 5px rgba(250, 204, 21, 0.2), 0 10px 20px -5px rgba(29, 78, 216, 0.5);
            transform: translateY(-4px) scale(1.02);
        }

        .icon {
            font-size: 38px;
            margin-bottom: 2px;
            filter: grayscale(100%);
            opacity: 0.15;
            transition: all 0.4s ease;
        }

        .card.active .icon {
            filter: grayscale(0%) drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            opacity: 1;
            transform: scale(1.15);
        }

        .label {
            font-size: 13px;
            font-weight: 800;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        /* 激活後的文字變成校徽的金黃色 */
        .card.active .label {
            color: var(--ssgc-gold);
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        /* 右上角的勾號標記：配合校徽的紅底金勾 */
        .stamp-mark {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--ssgc-red);
            color: var(--ssgc-gold);
            border: 2px solid var(--ssgc-gold);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0) rotate(-45deg);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .card.active .stamp-mark {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .congrats {
            display: none;
            background: #e6fffa;
            color: #234e52;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid #b2f5ea;
            animation: pop 0.4s ease-out;
        }

        .reset-btn {
            margin-top: 25px;
            background: transparent;
            border: 1px solid #cbd5e0;
            color: #a0aec0;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #edf2f7;
            color: #4a5568;
            border-color: #a0aec0;
        }

        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="school-title">St. Stephen’s Girls’ College<br>聖士提反女子中學</h1>
            <h2 class="event-title">120<sup>th</sup> Anniversary Open Day<br>一百二十周年校慶開放日</h2>
        </header>

        <div class="grid">
            <!-- Zone 1 -->
            <div class="card" id="zone1">
                <div class="stamp-mark">✓</div>
                <div class="icon">🏮</div>
                <div class="label">Zone 1</div>
            </div>

            <!-- Zone 2 -->
            <div class="card" id="zone2">
                <div class="stamp-mark">✓</div>
                <div class="icon">🎶</div>
                <div class="label">Zone 2</div>
            </div>

            <!-- Zone 3 -->
            <div class="card" id="zone3">
                <div class="stamp-mark">✓</div>
                <div class="icon">💻</div>
                <div class="label">Zone 3</div>
            </div>

            <!-- Zone 4 -->
            <div class="card" id="zone4">
                <div class="stamp-mark">✓</div>
                <div class="icon">💼</div>
                <div class="label">Zone 4</div>
            </div>

            <!-- Zone 5 -->
            <div class="card" id="zone5">
                <div class="stamp-mark">✓</div>
                <div class="icon">🧘‍♀️</div>
                <div class="label">Zone 5</div>
            </div>

            <!-- Zone 6 -->
            <div class="card" id="zone6">
                <div class="stamp-mark">✓</div>
                <div class="icon">🏀</div>
                <div class="label">Zone 6</div>
            </div>
        </div>

        <div class="congrats" id="congratsMessage">
            🎉 恭喜！您已成功集齊 6 個開放日活動印章！<br>
            Congratulations! You have collected all 6 Open Day stamps!
        </div>

        <button class="reset-btn" onclick="resetCard()">Reset 重置</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const zoneScanned = urlParams.get('zone'); 

        const validZones = ['zone1', 'zone2', 'zone3', 'zone4', 'zone5', 'zone6'];

        if (zoneScanned && validZones.includes(zoneScanned)) {
            localStorage.setItem(zoneScanned, 'true');
            
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({path: cleanUrl}, '', cleanUrl);
        }

        function renderStamps() {
            let completedCount = 0;

            validZones.forEach(zone => {
                const isStamped = localStorage.getItem(zone) === 'true';
                const cardElement = document.getElementById(zone);
                
                if (cardElement) {
                    if (isStamped) {
                        cardElement.classList.add('active');
                        completedCount++;
                    } else {
                        cardElement.classList.remove('active');
                    }
                }
            });

            if (completedCount === 6) {
                document.getElementById('congratsMessage').style.display = 'block';
            } else {
                document.getElementById('congratsMessage').style.display = 'none';
            }
        }

        function resetCard() {
            if (confirm("確定要清除所有印章記錄嗎？\nAre you sure you want to clear your stamps?")) {
                validZones.forEach(zone => localStorage.removeItem(zone));
                renderStamps();
            }
        }

        renderStamps();
    </script>
</body>
</html>
